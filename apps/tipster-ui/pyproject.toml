[project]
name = "tipster-ui"
version = "0.1.0"
description = "Streamlit dashboard for the AI-powered football tipster."
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38",
    "tipster-core",
]

[tool.uv.sources]
tipster-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tipster_ui"]