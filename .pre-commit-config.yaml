# Repo-wide pre-commit hooks. Language-agnostic fast checks only;
# language-specific linting lives inside each project.
# Install:  just setup   (or:  pip install pre-commit && pre-commit install)

repos:
  # Generic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # Markdown (GitHub issue/PR templates are body fragments, not documents,
  # so MD041 first-line-heading does not apply to them)
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--disable, MD013, --ignore, '.github/**/*.md', --]

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

# Per-project hooks (eslint, ruff, prettier, etc.) are added under the
# project's own config, not here — this file stays language-agnostic.
