[project]
name = "tipster-core"
version = "0.1.0"
description = "Domain library for the AI-powered football tipster: contracts, ingestion, DuckDB storage, and (later) features, model, value engine, backtesting."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "lightgbm>=4.5",
    "numpy>=2.0",
    "polars>=1.0",
    "pydantic>=2.8",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

[project.scripts]
tipster-ingest = "tipster_core.ingest.cli:main"
tipster-odds = "tipster_core.ingest.odds_cli:main"
tipster-backtest = "tipster_core.backtest.cli:main"
tipster-bets = "tipster_core.bet_log_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tipster_core"]
