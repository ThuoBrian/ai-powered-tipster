[project]
name = "ai-powered-tipster"
version = "0.1.0"
description = "AI-powered football tipster: value-betting engine with calibrated probabilities, market comparison, and LLM-generated reasoning."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.0",
    "ruff>=0.6",
]

# Root is a virtual (non-package) project: it exists to hold shared tool
# config and the dev group. All code lives in workspace members.
[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/tipster-ui",
    "packages/tipster-core",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/tipster-core/src", "apps/tipster-ui/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "T20"]

[tool.ruff.lint.per-file-ignores]
# The CLIs' stdout IS their interface — prints belong there.
"**/ingest/cli.py" = ["T201"]
"**/backtest/cli.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
files = ["packages/tipster-core/src", "apps/tipster-ui/src"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["streamlit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# lightgbm and sklearn ship no type stubs; scipy's are partial.
module = ["lightgbm.*", "sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = "-ra"
